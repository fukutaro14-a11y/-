<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>陸上指導 月謝管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
h1{font-size:25px;margin:5px 0 18px}h2{font-size:18px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:10px}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #ddd;font-size:15px}
button{background:#222;color:#fff;border:0;cursor:pointer;margin-top:7px}.danger{background:#b42318}.secondary{background:#666}
.month{display:flex;gap:8px;align-items:center}.month button{width:auto;padding:9px 13px;margin:0}.month select{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f6f6f7;padding:13px;border-radius:12px}.num{font-size:22px;font-weight:700;margin-top:3px}
.person{border-top:1px solid #eee;padding:12px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:700}.fee{color:#666;font-size:13px}
.pay{min-width:110px;width:auto;background:#ddd;color:#333;margin:0}.paid{background:#2e7d32;color:white}.actions{display:flex;gap:6px}.actions button{width:auto;padding:7px 9px;font-size:12px}
.badge{font-size:12px;padding:4px 7px;border-radius:999px;background:#eee}.paidBadge{background:#e4f5e6;color:#176b21}
.note{font-size:12px;color:#777;margin-top:5px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.row{align-items:flex-start}.pay{min-width:95px}}
</style>
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#222222"></head>
<body>
<div class="wrap">
<h1>🏃 陸上指導・月謝管理</h1>

<div class="card">
<h2>対象月</h2>
<div class="month">
<button onclick="changeMonth(-1)">‹</button>
<select id="month" onchange="render()"></select>
<button onclick="changeMonth(1)">›</button>
</div>
</div>

<div class="card">
<h2>生徒を追加</h2>
<div class="grid">
<input id="name" placeholder="生徒の名前">
<input id="fee" type="number" placeholder="月謝（円）" value="5000">
</div>
<button onclick="addStudent()">追加する</button>
</div>

<div class="card">
<h2>今月の状況</h2>
<div class="stats">
<div class="stat">生徒数<div id="total" class="num">0</div></div>
<div class="stat">受取済<div id="received" class="num">0</div></div>
<div class="stat">受取額<div id="income" class="num">¥0</div></div>
</div>
</div>

<div class="card">
<h2>生徒一覧</h2>
<div id="students"></div>
</div>

<div class="card">
<button class="secondary" onclick="exportCSV()">今月の一覧をCSV保存</button>
<button class="danger" onclick="resetAll()">全データ削除</button>
<p class="note">データはこの端末のブラウザ内に保存されます。月ごとの支払い履歴も残ります。</p>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("trackFeeData")||'{"students":[],"payments":{}}');
let current=new Date();
let selectedMonth=current.getFullYear()+"-"+String(current.getMonth()+1).padStart(2,"0");

function monthLabel(m){let [y,mo]=m.split("-");return `${y}年${Number(mo)}月`}
function initMonths(){
 const s=document.getElementById("month");s.innerHTML="";
 for(let i=-12;i<=12;i++){
  let d=new Date(current.getFullYear(),current.getMonth()+i,1);
  let m=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  let o=document.createElement("option");o.value=m;o.textContent=monthLabel(m);
  if(m===selectedMonth)o.selected=true;s.appendChild(o);
 }
}
function changeMonth(n){
 let [y,m]=selectedMonth.split("-").map(Number),d=new Date(y,m-1+n,1);
 selectedMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
 initMonths();render();
}
function addStudent(){
 let name=document.getElementById("name").value.trim(),fee=Number(document.getElementById("fee").value)||0;
 if(!name){alert("名前を入力してください");return}
 data.students.push({id:Date.now()+Math.random(),name,fee});
 document.getElementById("name").value="";save();
}
function key(id){return selectedMonth+"_"+id}
function togglePaid(id){
 let k=key(id);
 if(data.payments[k]) delete data.payments[k];
 else data.payments[k]={paidAt:new Date().toISOString()};
 save();
}
function editStudent(id){
 let s=data.students.find(x=>x.id===id);if(!s)return;
 let name=prompt("名前",s.name);if(name===null)return;
 let fee=prompt("月謝（円）",s.fee);if(fee===null)return;
 if(name.trim()){s.name=name.trim();s.fee=Number(fee)||0;save()}
}
function removeStudent(id){
 if(!confirm("この生徒を削除しますか？"))return;
 data.students=data.students.filter(x=>x.id!==id);
 Object.keys(data.payments).forEach(k=>{if(k.endsWith("_"+id))delete data.payments[k]});
 save();
}
function save(){localStorage.setItem("trackFeeData",JSON.stringify(data));render()}
function render(){
 document.getElementById("total").textContent=data.students.length;
 let received=0,income=0;
 data.students.forEach(s=>{if(data.payments[key(s.id)]){received++;income+=s.fee}});
 document.getElementById("received").textContent=received;
 document.getElementById("income").textContent="¥"+income.toLocaleString();
 let box=document.getElementById("students");
 if(!data.students.length){box.innerHTML='<p class="note">まだ生徒が登録されていません。</p>';return}
 box.innerHTML=data.students.map(s=>{
  let p=data.payments[key(s.id)],paid=!!p;
  let date=p?new Date(p.paidAt).toLocaleString("ja-JP"):"";
  return `<div class="person"><div class="row"><div><div class="name">${esc(s.name)}</div><div class="fee">月謝 ¥${s.fee.toLocaleString()}</div>${paid?`<div class="note">受取：${date}</div>`:""}</div>
  <div class="actions"><button class="pay ${paid?"paid":""}" onclick="togglePaid(${s.id})">${paid?"✓ 受取済":"未受取"}</button><button onclick="editStudent(${s.id})">編集</button><button class="danger" onclick="removeStudent(${s.id})">削除</button></div></div></div>`
 }).join("");
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function exportCSV(){
 let rows=[["名前","月","月謝","支払い"]];
 data.students.forEach(s=>rows.push([s.name,monthLabel(selectedMonth),s.fee,data.payments[key(s.id)]?"受取済":"未受取"]));
 let csv="\uFEFF"+rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")).join("\n");
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`月謝_${selectedMonth}.csv`;a.click();
}
function resetAll(){if(confirm("全生徒・全月の支払い履歴を削除しますか？")){localStorage.removeItem("trackFeeData");data={students:[],payments:{}};render()}}
initMonths();render();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body>
</html>
